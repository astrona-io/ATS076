    title: Get Your Machine Ready
    path: sections/intro/course-02-get-your-machine-ready.md
  - type: reading
    title: How This Course Is Made
    path: sections/intro/course-03-how-this-course-is-made.md
- id: module-010
  title: Context Propagation
  description: 'Makes the reader able to find where a trace is cut in two and to decide
    which context may cross a trust boundary: the traceparent and tracestate headers,
    a hop-by-hop test that finds the proxy that removes them, baggage, and removal
    of untrusted baggage at a public edge.'
  content:
  - type: reading
    title: Section Overview
    path: sections/section-010/README.md
  - type: reading
    title: Trace Context Across Process Boundaries
    path: sections/section-010/module-01/course.md
  - type: reading
    title: The Trace Context Headers
    path: sections/section-010/module-01/course-01-the-trace-context-headers.md
  - type: reading
    title: Finding Where The Context Stops
    path: sections/section-010/module-01/course-02-finding-where-the-context-stops.md
  - type: reading
    title: Question
    path: sections/section-010/module-01/labs/lab-01/question.md
  - type: lab
    title: Restore Trace Context Through A Gateway Lab
    path: sections/section-010/module-01/labs/lab-01
    difficulty: intermediate
    estimated_duration: 20m
    topic: context-propagation
    task_kind: troubleshooting
    tags:
    - traceparent
    - tracestate
    - nginx
    - proxy
    - propagation
    learning_goals:
    - Find the proxy that removes the W3C Trace Context headers with a request to
      each hop
    - Remove the rules that hide the headers and restart the proxy
    - Prove that both traceparent and tracestate reach the upstream
    resources:
    - name: W3C Trace Context
      url: https://www.w3.org/TR/trace-context/
    - name: OpenTelemetry Collector configuration
      url: https://opentelemetry.io/docs/collector/configuration/
  - type: reading
    title: Summary
    path: sections/section-010/module-01/course-03-summary.md
  - type: reading
    title: Baggage And Trust Boundaries
    path: sections/section-010/module-02/course.md
  - type: reading
    title: Baggage And How It Travels
    path: sections/section-010/module-02/course-01-baggage-and-how-it-travels.md
  - type: reading
    title: Untrusted Context At The Edge
    path: sections/section-010/module-02/course-02-untrusted-context-at-the-edge.md
  - type: reading
    title: Question
    path: sections/section-010/module-02/labs/lab-01/question.md
  - type: lab
    title: Strip Baggage At The Public Edge Lab
    path: sections/section-010/module-02/labs/lab-01
    difficulty: intermediate
    estimated_duration: 20m
    topic: context-propagation
    task_kind: build
    tags:
    - baggage
    - nginx
    - trust-boundary
    - propagation
    learning_goals:
    - Remove the baggage header on the public listener only
    - Keep baggage and the trace context on the internal listener
    - Restart the proxy and prove both listeners with requests
    resources:
    - name: W3C Baggage
      url: https://www.w3.org/TR/baggage/
    - name: W3C Trace Context
      url: https://www.w3.org/TR/trace-context/
  - type: reading
    title: Summary
    path: sections/section-010/module-02/course-03-summary.md
