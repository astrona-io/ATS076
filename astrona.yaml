# Course manifest for ATS076. Each section lists its README, modules (landing, parts, lab Question reading and lab entry after the part tested, summary), a capstone and a quiz.
training:
  id: ATS076
  title: 'OTCA: Maintaining and Debugging Observability Pipelines'
  description: Concept lessons, diagrams, playgrounds, graded labs, capstones and
    original scenario quizzes covering every published objective in this OTCA domain.
    Labs run on kind (Kubernetes 1.35) with the OpenTelemetry Collector.
  certification:
    name: OpenTelemetry Certified Associate
    code: OTCA
    provider: CNCF / Linux Foundation
    domain: Maintaining and Debugging Observability Pipelines
    weight: 10
    competencies:
    - Context Propagation
    - Debugging Pipelines
    - Error Handling
    - Schema Management
modules:
- id: module-intro
  title: Introduction
  description: Audience, learning approach, requirements and contribution process.
  content:
  - type: reading
    title: Introduction
    path: sections/intro/README.md
