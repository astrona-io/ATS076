# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Find The Receiver Missing From A Pipeline (LAB). Graded against the live cluster. Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-076-lab-020-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - otel/opentelemetry-collector-contrib:0.164.0
      - curlimages/curl:8.22.0

bootstrap:
  init:
    - name: seed-cluster
      description: Create the workloads and the faults
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh
    - name: wait-for-settled
      description: Wait until the restarted pods are ready
      type: file
      source: testing/wait-for-settled.sh

validation:
  scripts:
    - name: http-accepts-spans
      description: "The Collector accepts a span over OTLP/HTTP on port 4318"
      type: file
      source: validation/validate-http-accepts-spans.sh
      hint: "A receiver that is defined but not listed in a pipeline is never started. Add it to the traces pipeline, then restart the Collector."
    - name: span-in-debug-output
      description: "A span sent over OTLP/HTTP appears in the debug exporter output"
      type: file
      source: validation/validate-span-in-debug-output.sh
      hint: "The debug exporter must stay in the traces pipeline with verbosity detailed."
    - name: collector-healthy
      description: "The health check endpoint on port 13133 answers 200"
      type: file
      source: validation/validate-collector-healthy.sh
      hint: "Do not remove the health_check extension or break the configuration while you fix the pipeline."

teardown:
  keepCluster: false
