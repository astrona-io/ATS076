# Reference solution for Debugging Pipelines Capstone.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otelcol-config
  namespace: observability
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      otlp/grpc:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
      otlp/http:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    processors:
      filter/health:
        error_mode: ignore
        trace_conditions:
          - span.name == "GET /healthz"
    exporters:
      debug:
        verbosity: detailed
    service:
      extensions: [health_check]
      telemetry:
        metrics:
          level: normal
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      pipelines:
        traces:
          receivers: [otlp/grpc, otlp/http]
          processors: [filter/health]
          exporters: [debug]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pipeline-evidence
  namespace: observability
data:
  receiver: "otlp/http was defined but not listed in the traces pipeline"
  processor: "filter/health condition was inverted and dropped every span except GET /healthz"
  health: "health_check was defined but not listed in service.extensions"
  observed-at: "OBSERVED_AT"
