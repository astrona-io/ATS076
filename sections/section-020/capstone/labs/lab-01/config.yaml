# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Debugging Pipelines Capstone (LAB). Graded against the live cluster. Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-076-capstone-020
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - otel/opentelemetry-collector-contrib:0.164.0
      - curlimages/curl:8.22.0

bootstrap:
  init:
    - name: seed-cluster
      description: Create the workloads and the faults
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh
    - name: wait-for-settled
      description: Wait until the restarted pods are ready
      type: file
      source: testing/wait-for-settled.sh

validation:
  scripts:
    - name: http-accepts-spans
      description: "The Collector accepts a span over OTLP/HTTP on port 4318"
      type: file
      source: validation/validate-http-accepts-spans.sh
      hint: "Compare the receivers that are defined with the receivers a pipeline uses."
    - name: normal-span-kept
      description: "A span named POST /checkout reaches the debug exporter"
      type: file
      source: validation/validate-normal-span-kept.sh
      hint: "Read the filter condition and decide which spans it matches."
    - name: health-span-dropped
      description: "A span named GET /healthz does not reach the debug exporter"
      type: file
      source: validation/validate-health-span-dropped.sh
      hint: "The filter must still drop the health check span."
    - name: health-endpoint-up
      description: "The health check endpoint on port 13133 answers 200"
      type: file
      source: validation/validate-health-endpoint-up.sh
      hint: "An extension that is defined but not listed under service.extensions is not started."
    - name: evidence-recorded
      description: "The ConfigMap pipeline-evidence records one finding per stage and a UTC time"
      type: file
      source: validation/validate-evidence-recorded.sh
      hint: "Create ConfigMap pipeline-evidence in observability with the keys receiver, processor, health and observed-at."

teardown:
  keepCluster: false
