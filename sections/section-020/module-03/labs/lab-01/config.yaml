# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Reach The Collector Diagnostic Pages (LAB). Graded against the live cluster. Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-076-lab-020-03
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - otel/opentelemetry-collector-contrib:0.164.0
      - curlimages/curl:8.22.0

bootstrap:
  init:
    - name: seed-cluster
      description: Create the workloads and the faults
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh
    - name: wait-for-settled
      description: Wait until the restarted pods are ready
      type: file
      source: testing/wait-for-settled.sh

validation:
  scripts:
    - name: zpages-reachable
      description: "The zPages pipelinez page answers 200 from another pod"
      type: file
      source: validation/validate-zpages-reachable.sh
      hint: "The zpages extension is defined but not in service.extensions, and its endpoint is bound to localhost. Fix both, then restart the Collector."
    - name: pprof-reachable
      description: "The pprof index answers 200 from another pod"
      type: file
      source: validation/validate-pprof-reachable.sh
      hint: "The pprof extension has the same two problems as zpages: the service.extensions list and the host part of the endpoint."
    - name: collector-still-works
      description: "The health check answers 200 and the Collector still accepts a span"
      type: file
      source: validation/validate-collector-still-works.sh
      hint: "Keep health_check listed and keep the traces pipeline with the debug exporter. Do not remove components to make the check pass."

teardown:
  keepCluster: false
