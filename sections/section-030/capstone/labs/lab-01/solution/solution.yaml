# Reference solution for Error Handling Capstone.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otelcol-config
  namespace: observability
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      file_storage/queue:
        directory: /var/lib/otelcol/queue
        create_directory: true
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    processors:
      attributes/env:
        actions:
          - key: deployment.environment
            value: lab
            action: upsert
      memory_limiter:
        check_interval: 1s
        limit_mib: 150
        spike_limit_mib: 30
    exporters:
      debug:
        verbosity: detailed
      otlp_http/backend:
        endpoint: http://backend.observability:4318
        retry_on_failure:
          enabled: true
        sending_queue:
          enabled: true
          queue_size: 5000
          storage: file_storage/queue
    service:
      extensions: [health_check, file_storage/queue]
      telemetry:
        metrics:
          level: normal
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, attributes/env]
          exporters: [debug, otlp_http/backend]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loss-evidence
  namespace: observability
data:
  retry: "retry_on_failure is enabled for otlp_http/backend"
  queue: "sending_queue holds 5000 batches on disk through file_storage/queue"
  memory: "memory_limiter is first with limit_mib 150 for a 256Mi container"
  observed-at: "OBSERVED_AT"
