# Reference solution for Order And Size The Memory Limiter.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otelcol-config
  namespace: observability
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    processors:
      attributes/env:
        actions:
          - key: deployment.environment
            value: lab
            action: upsert
      memory_limiter:
        check_interval: 1s
        limit_mib: 150
        spike_limit_mib: 30
    exporters:
      debug:
        verbosity: detailed
    service:
      extensions: [health_check]
      telemetry:
        metrics:
          level: normal
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, attributes/env]
          exporters: [debug]
