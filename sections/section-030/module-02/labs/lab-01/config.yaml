# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Order And Size The Memory Limiter (LAB). Graded against the live cluster. Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-076-lab-030-02
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - otel/opentelemetry-collector-contrib:0.164.0
      - curlimages/curl:8.22.0

bootstrap:
  init:
    - name: seed-cluster
      description: Create the workloads and the faults
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh
    - name: wait-for-settled
      description: Wait until the restarted pods are ready
      type: file
      source: testing/wait-for-settled.sh

validation:
  scripts:
    - name: memory-limiter-first
      description: "memory_limiter is the first processor of the traces pipeline"
      type: file
      source: validation/validate-memory-limiter-first.sh
      hint: "Edit the processors list in service.pipelines.traces. Keep it on one line in flow style, for example processors: [memory_limiter, attributes/env]."
    - name: limit-fits-container
      description: "limit_mib is between 1 and 200 and spike_limit_mib is below limit_mib"
      type: file
      source: validation/validate-limit-fits-container.sh
      hint: "The container memory limit is 256Mi. The Collector process uses about 50 MiB more than limit_mib, so choose limit_mib at most 200."
    - name: env-attribute-kept
      description: "Spans still get the attribute deployment.environment=lab and are accepted"
      type: file
      source: validation/validate-env-attribute-kept.sh
      hint: "Keep the attributes/env processor in the pipeline. Only change its position."

teardown:
  keepCluster: false
