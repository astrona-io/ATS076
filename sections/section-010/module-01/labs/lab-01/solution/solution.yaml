# Reference solution for Restore Trace Context Through A Gateway.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-conf
  namespace: starfleet
data:
  nginx.conf: |
    events {}
    http {
      server {
        listen 80;
        location / {
          proxy_pass http://probe.starfleet.svc.cluster.local:80;
          proxy_set_header Host $host;

        }
      }
    }
