# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Emit Both Attribute Names During A Migration (LAB). Graded against the live cluster. Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-076-lab-040-02
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - otel/opentelemetry-collector-contrib:0.164.0
      - curlimages/curl:8.22.0

bootstrap:
  init:
    - name: seed-cluster
      description: Create the workloads and the faults
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh
    - name: wait-for-settled
      description: Wait until the restarted pods are ready
      type: file
      source: testing/wait-for-settled.sh

validation:
  scripts:
    - name: old-source-has-both
      description: "A span sent with the legacy names leaves with the legacy and the stable names"
      type: file
      source: validation/validate-old-source-has-both.sh
      hint: "Keep the legacy attribute: do not delete it. Copy the value to the stable name."
    - name: new-source-has-both
      description: "A span sent with the stable names leaves with the stable and the legacy names"
      type: file
      source: validation/validate-new-source-has-both.sh
      hint: "Copy the stable value to the legacy name where the stable attribute exists."
    - name: other-attributes-kept
      description: "Other attributes of the span stay unchanged"
      type: file
      source: validation/validate-other-attributes-kept.sh
      hint: "A statement must change only the attributes it names."

teardown:
  keepCluster: false
